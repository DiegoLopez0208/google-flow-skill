name: tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  npm-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pack and inspect npm distribution
        run: node scripts/check_npm_pack.cjs
      - name: Test packed executable
        run: node scripts/smoke_npm.cjs .npm-check/package/npm/cli.cjs

  wiring-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Only the Python packages. The tests never open a browser, so there is no
      # need for `playwright install` here.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile everything
        run: python -m compileall -q flow.py setup.py flow_provider tests

      # These cover the CLI wiring: batch ordering, references, credit budget,
      # crash recovery and download URL selection. They never touch the network
      # or a real Flow account.
      - name: Run the wiring tests
        run: python -m unittest discover -s tests -v

  package-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_artifacts.py
      - name: Install wheel
        shell: bash
        run: python -m pip install dist/*.whl
      - run: python scripts/smoke_installed.py
